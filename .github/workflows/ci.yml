name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.10.5"

jobs:
  python:
    name: python (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: pytest

  terraform:
    name: terraform (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --format compact --minimum-failure-severity=error

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Accepted findings, each with its reason. Anything else HIGH or CRITICAL fails.
          trivyignores: .trivyignore.yaml

  kubernetes:
    name: kubernetes (kustomize, kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The real overlays are generated from Terraform outputs at deploy time; the bases are what CI checks.
      - name: Render and validate the manifests against Kubernetes 1.36
        run: |
          for dir in k8s/base k8s/jobs/index k8s/jobs/eval; do
            docker run --rm -v "$PWD":/w -w /w registry.k8s.io/kustomize/kustomize:v5.8.1 build "$dir"
            echo ---
          done > rendered.yaml
          docker run --rm -v "$PWD":/w -w /w ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -kubernetes-version 1.36.0 rendered.yaml

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck synthea/*.sh scripts/*.sh
