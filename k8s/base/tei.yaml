# Text Embeddings Inference serving Qwen3-Embedding-0.6B on the CPU node, through an OpenAI-compatible
# /v1/embeddings API, for the questions clinicians ask: one short text at a time. Bulk indexing uses a
# GPU build instead (k8s/jobs/index/tei-gpu.yaml); on CPU it would take hours.
#
# Hardened as tested locally with the same image: non-root, read-only root filesystem, no capabilities.
# Memory: warm-up runs one batch of --max-batch-tokens. Locally (amd64 under emulation) the default 16,384
# exceeded 4 GiB and 4096 fit; on the real x86 node (m7i.large) 4096 was OOM-killed at 4 GiB too. 2048 is
# plenty: this server only embeds questions, a few dozen tokens each. The limit leaves the node room for
# the RAG API and one job (8 GiB node, ~7 GiB allocatable).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei
  labels: { app: tei }
spec:
  replicas: 1
  # Replace, do not overlap: the system node (2 vCPUs) cannot fit a second TEI next to the first, so a
  # rolling update would wait forever for room (found on the first AWS run).
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: tei }
  template:
    metadata:
      labels: { app: tei }
    spec:
      serviceAccountName: model-fetch
      enableServiceLinks: false # services are found through DNS; see vllm.yaml for why this matters
      nodeSelector:
        workload: system
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: fetch-model
          image: rag
          command: ["python", "-m", "clinical_rag.aws", "fetch", "$(MODELS_URI)qwen3-embedding-0_6b/", "/models/qwen3-embedding"]
          envFrom:
            - configMapRef: { name: aws-settings }
          volumeMounts:
            - { name: models, mountPath: /models }
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: tei
          image: tei
          args: ["--model-id", "/models/qwen3-embedding", "--port", "8080", "--max-batch-tokens", "2048", "--json-output"]
          env:
            - { name: HF_HUB_OFFLINE, value: "1" }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: "1", memory: 3Gi }
            limits: { memory: 6Gi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: models
          emptyDir: { sizeLimit: 5Gi }
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: tei
spec:
  selector: { app: tei }
  ports:
    - { name: http, port: 80, targetPort: http }
