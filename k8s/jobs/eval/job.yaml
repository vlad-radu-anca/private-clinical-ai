# Runs the evaluation suite against the deployed RAG API: the same questions and grading as on the laptop.
apiVersion: batch/v1
kind: Job
metadata:
  name: eval
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 5400
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: rag
      enableServiceLinks: false # services are found through DNS; see k8s/base/vllm.yaml
      nodeSelector:
        workload: system
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: eval
          image: rag
          command: ["python", "-m", "clinical_rag.evals", "--api", "http://rag:8000", "--patients", "30"]
          envFrom:
            - configMapRef: { name: aws-settings }
          env:
            - { name: DATABASE_NAME, value: rag }
            - { name: LLM_BASE_URL, value: "http://vllm:8000/v1" }
            - { name: LLM_BACKEND, value: vllm }
            - { name: LLM_MODEL, value: qwen3-8b }
            - { name: EMBED_BASE_URL, value: "http://tei/v1" }
            - { name: EMBED_MODEL, value: qwen3-embedding }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
