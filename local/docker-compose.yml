# Local dev stack: HAPI FHIR R4 server, its PostgreSQL, and the phase 2 RAG service
# with pgvector. The model runs in Ollama on the host, using the Mac's GPU.
# Ports are bound to 127.0.0.1 only, so nothing is reachable from your LAN.
#   docker compose -f local/docker-compose.yml up -d
#   curl http://localhost:8080/fhir/metadata   # FHIR
#   curl http://localhost:8000/health          # RAG API

services:
  db:
    image: postgres:16.16
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - hapi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      retries: 20

  hapi:
    # Same tag as the one mirrored to ECR for AWS (HAPI_TAG in scripts/push-images.sh).
    image: hapiproject/hapi:${HAPI_TAG:-v8.12.0-2}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      HAPI_FHIR_FHIR_VERSION: R4
      JAVA_TOOL_OPTIONS: "-Xmx3g"

  vectordb:
    # Same major version as HAPI's database and the RDS instance in AWS.
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-change-me-locally}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rag-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 20

  rag:
    build: ../rag
    depends_on:
      vectordb:
        condition: service_healthy
      hapi:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FHIR_URL: http://hapi:8080/fhir
      DATABASE_URL: postgresql://rag:${RAG_DB_PASSWORD:-change-me-locally}@vectordb:5432/rag
      # Ollama on the host. In AWS this becomes the vLLM service inside the VPC.
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_BACKEND: ollama
      LLM_MODEL: qwen3:8b
      EMBED_MODEL: qwen3-embedding:0.6b

volumes:
  hapi-db:
  rag-db:
